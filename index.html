<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <script type="module" src="js/main.js" defer></script>
    <title>Gröna Kartan</title>
</head>

<body>
    <aside>
        <!-- En liten flik på sidan -->
        <div id="start-div">
            <div id="search-flex">
                <input type="text" id="search-act" placeholder="Sök här"> <button id="search-btn">Sök</button>
            </div>
            <!-- Ska man lägga in språk här? -->
            <hr>
            <!-- Filtersektion -->
            <div id="symbol-filters">
                <div class="filter-group fil-places">
                    <p>Platser:</p>
                    <div class="group-symbols">
                        <img src="img/symbols/naturreservat-inv.png" alt="Naturreservat" class="symbols nature-reserve">
                        <img src="img/symbols/skog-inv.png" alt="Skog" class="symbols forest">
                        <img src="img/symbols/park-inv.png" alt="Park" class="symbols park">
                        <img src="img/symbols/trädgård-inv.png" alt="Trädgård" class="symbols garden">
                        <img src="img/symbols/vatten-inv.png" alt="Sjö" class="symbols lake">
                    </div>
                </div>
                <div class="filter-group fil-activity">
                    <p>Aktiviteter:</p>
                    <div class="group-symbols">
                        <img src="img/symbols/promenad-inv.png" alt="Promenadstråk" class="symbols path">
                        <img src="img/symbols/fågelskådning-inv.png" alt="Fågelskådning" class="symbols bird">
                        <img src="img/symbols/badplats-inv.png" alt="Badplats" class="symbols beach">
                        <img src="img/symbols/paddla-inv.png" alt="Paddla" class="symbols canoe">
                        <img src="img/symbols/grillplats-inv.png" alt="Grillplats" class="symbols bbq">
                        <img src="img/symbols/vindskydd-inv.png" alt="Vindskydd" class="symbols wind-shield">
                        <img src="img/symbols/lekplats-inv.png" alt="Vindskydd" class="symbols playground">
                        <img src="img/symbols/utegym-inv.png" alt="Utegym" class="symbols gym">
                        <img src="img/symbols/rastplats-inv.png" alt="Bänk" class="symbols bench">
                        <img src="img/symbols/fika-inv.png" alt="Fika" class="symbols cafe">
                    </div>
                </div>
                <div class="filter-group fil-access">
                    <p>Tillgänglighet:</p>
                    <div class="group-symbols">
                        <img src="img/symbols/barnvagn-inv.png" alt="Barnvagnsvänligt" class="symbols stroller">
                        <img src="img/symbols/rullstol-inv.png" alt="Rullstolsvänligt" class="symbols wheelchair">
                        <img src="img/symbols/toalett-inv.png" alt="Toalett" class="symbols toilet">
                        <img src="img/symbols/dass-inv.png" alt="Dass" class="symbols portapotty">
                        <img src="img/symbols/parkering-inv.png" alt="Parkering" class="symbols parking">
                        <img src="img/symbols/cykel-inv.png" alt="Cykel" class="symbols bike">
                        <img src="img/symbols/buss-inv.png" alt="Buss" class="symbols bus">
                    </div>
                </div>

                <!-- Lägga till en papperskorg eller ngt, som rensar alla filter -->
            </div>
            <hr>
            <h1>Närmast dig</h1>
            <section class="cards-holder">
                <div class="place-card">
                    <div class="place-card-img"></div>
                    <div class="place-card-info">
                        <h2>Namn på plats</h2>
                        <p>Typ av plats</p>
                        <p>Distans från tavlan</p>
                        <div class="place-card-symbols"></div>
                    </div>
                </div>
            </section>
        </div>
        <div id="detail-div">
            <!-- Här hamnar detaljsidan när man klickar -->
        </div>
    </aside>
    <main>
        <!-- Kartan som underlag -->
        <div id="map"></div>
    </main>
</body>

</html>
